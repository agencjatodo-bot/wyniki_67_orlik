:root { --accent:#b0127d; --yellow:#f9c22e; --dark:#2a1636; --muted:#7a6c80; --soft:#f7f2ee; }
html, body { height:100%; }
html { background:linear-gradient(180deg,#ea6432 0%,#c0473f 22%,#8a2a4a 48%,#4a1a4e 72%,#2a1636 100%) #2a1636 fixed; }

let seen = null;
async function load() {
  if (!URL_) { list.innerHTML = '<div class="empty">Brak adresu arkusza w config.js</div>'; return; }
  try {
    const d = await (await fetch(URL_ + '?limit=' + LIMIT + '&_=' + Date.now())).json();
    if (!d.ok) throw 0;
    const key = e => e.t + '|' + e.name + '|' + e.score;
    const prev = seen; seen = new Set(d.top.map(key));
    list.innerHTML = d.top.length ? d.top.map((e, i) => `
      <div class="row ${i < 3 ? 'p' + (i + 1) : ''} ${prev && !prev.has(key(e)) ? 'new' : ''}">
        <div class="rank">${i + 1}</div><div class="name">${esc(e.name)}</div><div class="score">${e.score}</div>
      </div>`).join('') : '<div class="empty">Brak wyników. Bądź pierwszy!</div>';
    err.textContent = '';
  } catch (e) { err.textContent = '⚠ brak połączenia – ponawiam'; }
}
document.body.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
});
load(); setInterval(load, REFRESH_MS);
</script>
</body>
</html>
